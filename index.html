<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Subnet Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>IP Subnet Calculator</h1>
        <input type="text" id="ip" placeholder="Enter IP (e.g., 192.168.1.1 or 192.168.1.1/24)">
        <input type="text" id="cidr" placeholder="CIDR or Subnet Mask (e.g., 24 or 255.255.255.0)">
        <button onclick="calculate()">Calculate</button>
        <div id="result" class="result"></div>

        <h2>CIDR to Subnet Mask Table</h2>
        <p style="color: #a0a0a0; font-size: 14px; margin-top: 10px;">Click any row to auto-fill the calculator</p>
        <table id="cidrTable">
            <thead>
                <tr>
                    <th>CIDR</th>
                    <th>Subnet Mask</th>
                    <th>Wildcard Mask</th>
                    <th>Hosts</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        // Add Enter key listener
        document.addEventListener('DOMContentLoaded', function() {
            const ipInput = document.getElementById('ip');
            const cidrInput = document.getElementById('cidr');

            [ipInput, cidrInput].forEach(input => {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        calculate();
                    }
                });
            });
        });

        function ipToBinary(ip) {
            return ip.split('.')
                     .map(num => ('00000000' + parseInt(num, 10).toString(2)).slice(-8))
                     .join('');
        }

        function binaryToIp(bin) {
            return [
                parseInt(bin.slice(0, 8), 2),
                parseInt(bin.slice(8, 16), 2),
                parseInt(bin.slice(16, 24), 2),
                parseInt(bin.slice(24, 32), 2)
            ].join('.');
        }

        function cidrToMask(cidr) {
            return binaryToIp('1'.repeat(cidr).padEnd(32, '0'));
        }

        function cidrToWildcard(cidr) {
            const mask = cidrToMask(cidr).split('.').map(Number);
            return mask.map(octet => 255 - octet).join('.');
        }

        function subnetMaskToCidr(mask) {
            // Convert subnet mask (e.g., 255.255.255.0) to CIDR (e.g., 24)
            const parts = mask.split('.').map(Number);
            if (parts.length !== 4 || !parts.every(p => p >= 0 && p <= 255)) {
                return null;
            }
            const binary = parts.map(p => ('00000000' + p.toString(2)).slice(-8)).join('');
            const cidr = binary.indexOf('0');
            return cidr === -1 ? 32 : cidr;
        }

        function parseIpInput(input) {
            // Parse IP input that may contain /CIDR notation
            const slashIndex = input.indexOf('/');
            if (slashIndex !== -1) {
                const ip = input.substring(0, slashIndex).trim();
                const cidr = input.substring(slashIndex + 1).trim();
                return { ip, cidr };
            }
            return { ip: input, cidr: null };
        }

        function parseCidrInput(input) {
            // Parse CIDR input that may be numeric or subnet mask format
            input = input.trim();

            // Check if it's a subnet mask (contains dots)
            if (input.includes('.')) {
                const cidr = subnetMaskToCidr(input);
                if (cidr === null) {
                    return null;
                }
                return cidr;
            }

            // Otherwise treat as numeric CIDR
            const cidr = parseInt(input, 10);
            if (isNaN(cidr) || cidr < 0 || cidr > 32) {
                return null;
            }
            return cidr;
        }

        function calculate() {
            const ipInputValue = document.getElementById('ip').value.trim();
            const cidrInputValue = document.getElementById('cidr').value.trim();
            const resultDiv = document.getElementById('result');

            // Parse IP input (may contain /CIDR)
            const { ip: parsedIp, cidr: embeddedCidr } = parseIpInput(ipInputValue);

            // Determine CIDR: prefer embedded CIDR, fallback to input field
            let cidr = null;
            if (embeddedCidr !== null) {
                cidr = parseCidrInput(embeddedCidr);
            } else if (cidrInputValue) {
                cidr = parseCidrInput(cidrInputValue);
            }

            // Validate
            if (!isValidIP(parsedIp)) {
                resultDiv.innerHTML = '<ul><li><strong>Error:</strong> Invalid IP address format!</li></ul>';
                return;
            }

            if (cidr === null) {
                resultDiv.innerHTML = '<ul><li><strong>Error:</strong> Invalid CIDR or Subnet Mask!</li></ul>';
                return;
            }

            // Calculate subnet information
            const ipBin = ipToBinary(parsedIp);
            const maskBin = '1'.repeat(cidr).padEnd(32, '0');
            const netBin = (parseInt(ipBin, 2) & parseInt(maskBin, 2)).toString(2).padStart(32, '0');
            const broadcastBin = (parseInt(netBin, 2) | (~parseInt(maskBin, 2) >>> 0)).toString(2).padStart(32, '0');

            const network = binaryToIp(netBin);
            const broadcast = binaryToIp(broadcastBin);
            const totalHosts = Math.pow(2, 32 - cidr);
            const usableHosts = cidr < 31 ? totalHosts - 2 : (cidr === 31 ? 2 : 1);
            const firstHost = cidr < 31 ? incrementIp(network) : network;
            const lastHost = cidr < 31 ? decrementIp(broadcast) : broadcast;
            const subnetMask = cidrToMask(cidr);
            const wildcardMask = cidrToWildcard(cidr);

            // Display results in bullet point format
            resultDiv.innerHTML =
                `<ul>
                    <li><strong>IP Address:</strong> ${parsedIp}/${cidr}</li>
                    <li><strong>Subnet Mask:</strong> ${subnetMask}</li>
                    <li><strong>Wildcard Mask:</strong> ${wildcardMask}</li>
                    <li><strong>Network Address:</strong> ${network}</li>
                    <li><strong>Broadcast Address:</strong> ${broadcast}</li>
                    <li><strong>Total Addresses:</strong> ${totalHosts.toLocaleString()}</li>
                    <li><strong>Usable Hosts:</strong> ${usableHosts.toLocaleString()}</li>
                    <li><strong>Host Range:</strong> ${firstHost} - ${lastHost}</li>
                </ul>`;
        }

        function incrementIp(ip) {
            let parts = ip.split('.').map(Number);
            for (let i = 3; i >= 0; i--) {
                if (parts[i] < 255) { parts[i]++; break; }
                else parts[i] = 0;
            }
            return parts.join('.');
        }

        function decrementIp(ip) {
            let parts = ip.split('.').map(Number);
            for (let i = 3; i >= 0; i--) {
                if (parts[i] > 0) { parts[i]--; break; }
                else parts[i] = 255;
            }
            return parts.join('.');
        }

        function isValidIP(ip) {
            const parts = ip.split('.');
            return parts.length === 4 && parts.every(p => {
                const num = Number(p);
                return !isNaN(num) && num >= 0 && num <= 255;
            });
        }

        function populateCIDRTable() {
            const tbody = document.querySelector("#cidrTable tbody");
            for (let i = 0; i <= 32; i++) {
                const tr = document.createElement("tr");
                const mask = cidrToMask(i);
                const wildcard = cidrToWildcard(i);
                const hosts = i < 31 ? Math.pow(2, 32 - i) - 2 : (i === 31 ? 2 : 1);

                tr.innerHTML = `<td>/${i}</td><td>${mask}</td><td>${wildcard}</td><td>${hosts.toLocaleString()}</td>`;
                tr.style.cursor = 'pointer';
                tr.setAttribute('data-cidr', i);

                // Add click handler to auto-fill calculator
                tr.addEventListener('click', function() {
                    const cidr = this.getAttribute('data-cidr');
                    document.getElementById('cidr').value = cidr;

                    // Scroll to top smoothly
                    window.scrollTo({ top: 0, behavior: 'smooth' });

                    // Focus on IP input for user convenience
                    setTimeout(() => {
                        document.getElementById('ip').focus();
                    }, 500);

                    // Add visual feedback
                    this.style.background = 'rgba(212, 175, 55, 0.3)';
                    setTimeout(() => {
                        this.style.background = '';
                    }, 300);
                });

                tbody.appendChild(tr);
            }
        }

        populateCIDRTable();
    </script>
</body>
</html>
